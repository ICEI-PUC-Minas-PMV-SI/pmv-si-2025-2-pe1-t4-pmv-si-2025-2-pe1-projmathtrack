<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathTrack - Página do Módulo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background-color: #f3f5f9;
      color: #333;
    }

    /* ----- CABEÇALHO ----- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 10px 30px;
      border-bottom: 1px solid #ccc;
    }

    header h1 {
      font-size: 32px;
      font-weight: 600;
      color: #222;
    }

    .config {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #5a4dff;
      font-weight: 500;
      cursor: pointer;
    }

    .config::before {
      content: "⚙️";
      font-size: 18px;
    }

    /* ----- LAYOUT GERAL ----- */
    .container {
      display: grid;
      grid-template-columns: 200px 1fr 200px;
      height: calc(100vh - 60px);
    }

    /* ----- MENU ESQUERDO ----- */
    .sidebar {
      background-color: white;
      border-right: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
    }

    .sidebar .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #e1e1e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 10px;
    }

    .sidebar a {
      color: #5a4dff;
      text-decoration: none;
      margin: 10px 0;
      font-weight: 500;
      border-left: 3px solid transparent;
      padding-left: 8px;
      transition: 0.2s;
    }

    .sidebar a:hover,
    .sidebar a.active {
      border-left: 3px solid #5a4dff;
    }

    /* ----- CONTEÚDO CENTRAL ----- */
    .main {
      background-color: #fdfdfd;
      padding: 20px 40px;
      border-right: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main h2 {
      font-size: 22px;
      margin-bottom: 60px;
      align-self: flex-start;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }

    .buttons button {
      background-color: transparent;
      color: #5a4dff;
      border: 1px solid #5a4dff;
      border-radius: 4px;
      padding: 8px 20px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .buttons button:hover {
      background-color: #5a4dff;
      color: white;
    }

    /* ----- MENU DIREITO ----- */
    .rightbar {
      background-color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .search select {
      width: 100%;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .rightbar a {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #5a4dff;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      padding-bottom: 2px;
      transition: 0.2s;
    }

    .rightbar a:hover {
      border-bottom: 2px solid #5a4dff;
    }
  </style>
</head>
<body>
  <header>
    <h1>MathTrack</h1>
    <div class="config">Configurações</div>
  </header>

  <div class="container">
    <!-- MENU ESQUERDO -->
    <div class="sidebar">
      <div class="avatar">👤</div>
      <a href="#" class="active">Usuário</a>
      <a href="#">Caixa de Entrada</a>
      <a href="#">Testes</a>
      <a href="#">Ajuda</a>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="main">
      <h2>Página do Módulo</h2>
      <div class="buttons">
        <button>Conteúdo do Módulo</button>
        <button>Teste</button>
        <button>Desempenho</button>
      </div>
    </div>

    <!-- MENU DIREITO -->
    <div class="rightbar">
      <div class="search">
        <select>
          <option>Buscar</option>
        </select>
      </div>
      <a href="#">🔍 Módulos</a>
      <a href="#">💬 Fórum</a>
      <a href="#">📘 Materiais</a>
    </div>
  </div>
</body>
</html>
