<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MathTrack — Conteúdo</title>

    <link rel="stylesheet" href="/src/styles/Base.css" />
    <link rel="stylesheet" href="/src/styles/pages/conteudo.css" />
    <link rel="stylesheet" href="/src/styles/components/navbar.css" />
    <link rel="stylesheet" href="/src/styles/components/footer.css" />

    <div data-include="/src/components/navbar.html"></div>
</head>

<body>

    <main>
        <!-- Título do módulo -->
        <h2 id="titulo-modulo" class="titulo-modulo"></h2>

        <!-- Conteúdo do módulo -->
        <div class="conteudo">
            <div class="video-container" id="video-container"></div>
            <section id="conteudo-texto"></section>
        </div>
    </main>

    <div data-include="/src/components/footer.html"></div>


    <script type="module" src="/src/scripts/incluir-partes.js"></script>
    <script src="/src/scripts/auth.js" defer></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (!window.requireLoginPopup || !requireLoginPopup('Você precisa estar logado para acessar o conteúdo.')) {
          const main = document.querySelector('main');
          if (main) main.style.filter = 'blur(3px)';
        }
      });
    </script>
    <script src="/src/scripts/conteudo.js"></script>
</body>

</html>
