<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MathTrack — Criar conta</title>

  <!-- Estilos -->
  <link rel="stylesheet" href="/src/styles/Base.css" />
  <link rel="stylesheet" href="/src/styles/pages/criar-conta.css" />
  <link rel="stylesheet" href="/src/styles/components/navbar.css">
  <link rel="stylesheet" href="/src/styles/components/footer.css" />

  <!-- Navbar incluída por script - JS -->
  <div data-include="/src/components/navbar.html"></div>
</head>

<body>
  <div class="container">
    <div class="main-content">
      <div class="title">
        <h1>Criar conta</h1>
      </div>

      <!-- Formulário de cadastro -->
      <form id="signupForm" class="form" novalidate>
        <input id="nome" type="text" placeholder="Nome:" class="input-field" required />
        <input id="nascimento" type="date" placeholder="Data de nascimento:" class="input-field" />
        <input id="celular" type="tel" placeholder="Celular:" class="input-field" />

        <input id="email" type="email" placeholder="Email:" class="input-field" required />
        <input id="email2" type="email" placeholder="Confirmar email:" class="input-field" required />

        <input id="senha" type="password" placeholder="Senha:" class="input-field" required />

        <button type="submit" class="btn">Criar conta</button>

        <p style="margin-top:10px">
          Já possui conta?
          <a href="/src/pages/login.html" style="color: #0066cc; text-decoration: underline;">Entrar</a>
        </p>
      </form>
    </div>
  </div>

  <!-- Footer incluído por JS -->
  <div data-include="/src/components/footer.html"></div>

  <!-- Scripts -->
  <script type="module" src="/src/scripts/incluir-partes.js" defer></script>
  <script src="/src/scripts/signup.js" defer></script>
  <script src="/src/scripts/auth.js" defer></script>
   

</body>
</html>
