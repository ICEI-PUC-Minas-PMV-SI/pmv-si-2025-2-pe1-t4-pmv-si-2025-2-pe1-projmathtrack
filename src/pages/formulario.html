<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MathTrack — formulario </title>

    <!-- Estilo da Página:
   Tem que colocar CSS da Página, Navbar, Footer e Bse -->
    <link rel="stylesheet" href="/src/styles/Base.css" />
    <link rel="stylesheet" href="/src/styles/pages/formulario.css" />
    <link rel="stylesheet" href="/src/styles/components/navbar.css">
    <link rel="stylesheet" href="/src/styles/components/footer.css" />

    <!-- Aqui incluímos o Navbar-->
    <div data-include="/src/components/navbar.html"></div>
</head>
<body>

    <main class="container">
        <header>
            <h1>MathTrack</h1>
        </header>
        <section class="content">
            <h2>Teste de Nivelamento</h2>
            <form action="#">
                <div class="input-group">
                    <label for="p1"> Quanto é 15 + 12?</label>
                    <input type="text" id="p1" placeholder="Resposta">
                </div>
                
                <div class="input-group">
                    <label for="p2"> Quanto é 9 - 5?</label>
                    <input type="text" id="p2" placeholder="Resposta">
                </div>

                <div class="input-group">
                    <label for="p3"> Quanto é 12 x 4?</label>
                    <input type="text" id="p3" placeholder="Resposta">
                </div>

                <div class="input-group">
                    <label for="p4"> Quanto é 60 ÷ 6?</label>
                    <input type="text" id="p4" placeholder="Resposta">
                </div>
                <a href="\src\pages\historico.html" class="btn-submit">Enviar</a>
            </form>
        </section>
    </main>

    <!-- Aqui é para colocar o Footer-->
    <div data-include="/src/components/footer.html"></div>

    <!-- JS para incluir a Navbar e o Footer -->
    <script type="module" src="/src/Scripts/incluir-partes.js"></script>

</body>
</html>
