<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MathTrack — Login</title>

    <!-- Estilo da Página:
   Tem que colocar CSS da Página, Navbar, Footer e Bse -->
    <link rel="stylesheet" href="/src/styles/Base.css" />
    <link rel="stylesheet" href="/src/styles/pages/login.css" />
    <link rel="stylesheet" href="/src/styles/components/navbar.css">
    <link rel="stylesheet" href="/src/styles/components/footer.css" />

    <!-- Aqui incluímos o Navbar-->
    <div data-include="/src/components/navbar.html"></div>
</head>
<body>
    <div class="container">
        <div class="main-content">
            <div class="welcome-title">
                <h1><span class="bold">Bem-vindo</span> <span class="normal">ao</span> <span class="bold">MathTrack!</span></h1>
            </div>
            <form id="loginForm" class="login-form" novalidate>
                <input id="loginEmail" type="email" placeholder="Email:" class="input-field" required />
                <input id="loginSenha" type="password" placeholder="Senha:" class="input-field" required />
                
                <div id="loginError" class="error-text" style="display:none; color: red; margin-bottom: 10px;"></div>
                
                <button type="submit" class="btn btn-primary">Entrar</button>
                <a href="/src/pages/recuperar-senha.html" class="btn btn-secondary">Esqueci minha senha</a>
                <a href="/src/pages/criar-conta.html" class="btn btn-secondary">Novo por aqui? Criar conta</a>
            </form>
        </div>
    </div>
        <!-- Aqui é para colocar o Footer-->
    <div data-include="/src/components/footer.html"></div>

    <!-- JS para incluir a Navbar e o Footer -->
    <script type="module" src="/src/scripts/incluir-partes.js"></script>

    <!-- Script de login -->
    <script src="/src/scripts/login.js" defer></script>

    <script src="/src/scripts/auth.js" defer></script>
</body>
</html>
