<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MathTrack — Teste do Módulo</title>

    <link rel="stylesheet" href="/src/styles/Base.css" />
    <link rel="stylesheet" href="/src/styles/pages/teste.css" />
    <link rel="stylesheet" href="/src/styles/components/navbar.css">
    <link rel="stylesheet" href="/src/styles/components/footer.css" />

    <div data-include="/src/components/navbar.html"></div>
</head>

<body>
    <main class="teste-page">
        <div class="teste-container">
            <div class="teste-header">
                <h1 id="teste-titulo">Teste do Módulo</h1>
                <p id="teste-descricao">Responda às questões abaixo</p>
            </div>

            <div class="info-teste">
                <p>📝 <strong>Total de questões:</strong> <span id="total-questoes">5</span></p>
                <p>✅ <strong>Nota mínima para aprovação:</strong> 60%</p>
                <p>⏱️ <strong>Tempo estimado:</strong> 10 minutos</p>
            </div>

            <form id="form-teste" class="teste-form">
                <div id="questoes-container" class="questoes-container">
                    <div class="loading">Carregando questões...</div>
                </div>

                <div class="teste-actions">
                    <button type="button" class="btn btn-secondary" onclick="window.history.back()">
                        ← Voltar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Enviar Respostas
                    </button>
                </div>
            </form>

            <div id="resultado-teste" class="resultado-container" style="display: none;">
                <h2 id="resultado-titulo">Resultado do Teste</h2>
                <div class="resultado-stats">
                    <p><strong>Acertos:</strong> <span id="acertos">0</span> de <span id="total">5</span></p>
                    <p><strong>Nota:</strong> <span id="nota">0</span>%</p>
                    <p id="status-aprovacao"></p>
                </div>
                <div class="resultado-acoes">
                    <button class="btn btn-primary" onclick="voltarTrilha()">Voltar para Trilha</button>
                    <button class="btn btn-secondary" onclick="refazerTeste()" id="btn-refazer">Refazer Teste</button>
                </div>
            </div>
        </div>
    </main>

    <div data-include="/src/components/footer.html"></div>

    <script type="module" src="/src/scripts/incluir-partes.js"></script>
    <script src="/src/scripts/teste-modulo.js"></script>
    <script src="/src/scripts/auth.js" defer></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (!window.requireLoginPopup || !requireLoginPopup('Você precisa estar logado para fazer o teste.')) {
          const main = document.querySelector('main');
          if (main) main.style.filter = 'blur(3px)';
        }
      });
    </script>
</body>
</html>
