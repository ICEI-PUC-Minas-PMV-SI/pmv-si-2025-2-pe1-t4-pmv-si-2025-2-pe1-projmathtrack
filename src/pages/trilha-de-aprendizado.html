<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MathTrack — Trilha de Aprendizado</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="/src/styles/Base.css" />
    <link rel="stylesheet" href="/src/styles/pages/trilha.css" />
    <link rel="stylesheet" href="/src/styles/components/navbar.css">
    <link rel="stylesheet" href="/src/styles/components/footer.css" />

    <!-- Navbar -->
    <div data-include="/src/components/navbar.html"></div>
</head>

    <body>
    <header class="trilha-header">
        <div class="container">
            <h1 class="trilha-title">Trilha de Aprendizado</h1>
            <p class="trilha-description">Acompanhe seu progresso e continue evoluindo em matemática</p>
        </div>
    </header>
 
        <div class="container">
        <!-- Módulos -->
        <div class="modulos" id="modulosContainer">
            <div class="loading">Carregando módulos...</div>
                </div>
               
        <!-- Estágio Atual -->
        <div class="estagio" id="estagioContainer">
            <h3>Seu Estágio Atual</h3>
            <div class="loading">Carregando...</div>
                </div>

        <!-- Continuar -->
        <div class="continuar" id="continuarContainer">
            <h3>Continuar onde parou</h3>
            <div class="loading">Carregando...</div>
                </div>

        <!-- Fórum -->
        <div class="forum" id="forumContainer">
            <h3>Fóruns</h3>
            <div class="loading">Carregando...</div>
            </div>

        <!-- Evolução -->
        <div class="evolucao" id="evolucaoContainer">
            <h3>Desempenho: Evolução dos Estudos</h3>
            <div class="loading">Carregando...</div>
                </div>

        <!-- Testes -->
        <div class="tarefa" id="tarefaContainer">
            <h3>Testes</h3>
            <div class="loading">Carregando...</div>
                </div>
            </div>

    <!-- Footer -->
    <div data-include="/src/components/footer.html"></div>

    <!-- Scripts -->
    <script type="module" src="/src/scripts/incluir-partes.js"></script>
    <script src="/src/scripts/auth.js" defer></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (!window.requireLoginPopup || !requireLoginPopup('Você precisa estar logado para acessar sua trilha de aprendizado.')) {
          const main = document.querySelector('main');
          if (main) main.style.filter = 'blur(3px)';
        }
      });
    </script>
    <script src="/src/scripts/trilha-aprendizado.js" defer></script>
</body>
</html>
